<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="HandheldFriendly" content="true">
  <meta name="MobileOptimized" content="width">

  <!-- Primary SEO -->

  <meta name="description" content="Explore what happened on this day in history. Daily historical events, famous birthdays, deaths, holidays, and AI-powered storytelling.">
  <meta name="keywords" content="on this day, today in history, historical events, birthdays, deaths, holidays, AI history, daily calendar">
  <link rel="canonical" href="https://calendarlyai.netlify.app/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="On This Day · History & AI">
  <meta property="og:title" content="On This Day · History, Holidays & AI Insights">
  <meta property="og:description" content="Daily historical events, famous birthdays, deaths, and holidays — powered by AI storytelling.">

  <link rel="icon" href="./favicon.ico">
  <link rel="manifest" href="./manifest.webmanifest">

  <!-- Google Font & refined styling -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* ----- reset & base ----- */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f6f9fc;
      color: #0b1a33;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      line-height: 1.5;
    }
    .app {
      max-width: 100vw;
      width: 100%;
      background: white;
      box-shadow: 0 20px 40px -12px rgba(0,20,40,0.12), 0 8px 24px -6px rgba(0,0,0,0.02);
      overflow: hidden;
      transition: box-shadow 0.2s;
    }

    /* ----- header / hero ----- */
    .hero {
      background: linear-gradient(145deg, #0b1a33, #1e3a6b);
      padding: 1.4rem 2rem;
      border-radius: 2px;
      color: white;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 14px rgba(11,26,51,0.10);
    }
    .hero h1 {
      font-weight: 600;
      font-size: 1.8rem;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .hero h1 span {
      background: #fbbf24;
      color: #0b1a33;
      padding: 0.1rem 1.2rem;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.3px;
    }
    .hero-badge {
      background: rgba(255,255,255,0.08);
      padding: 0.4rem 1.4rem;
      border-radius: 60px;
      font-weight: 450;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 0.85rem;
      letter-spacing: 0.2px;
    }
    @media (max-width: 640px) {
      .hero { flex-direction: column; align-items: flex-start; gap: 0.6rem; padding: 1rem 1.2rem; }
      .hero h1 { font-size: 1.4rem; flex-wrap: wrap; }
    }

    /* ----- rotating banner (above calendar nav) ----- */
    .banner-container {
      width: 100%;
      overflow: hidden;
      position: relative;
      background: #eef2f6;
      aspect-ratio: 16 / 5;
      min-height: 120px;
    }
    .banner-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.8s ease-in-out;
      opacity: 0;
    }
    .banner-container img.active {
      opacity: 1;
    }
    .banner-container .banner-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 0.6rem 1.2rem;
      background: linear-gradient(transparent, rgba(11,26,51,0.4));
      color: white;
      font-weight: 500;
      font-size: 0.9rem;
      backdrop-filter: blur(2px);
      letter-spacing: 0.3px;
      text-shadow: 0 1px 6px rgba(0,0,0,0.2);
    }
    @media (max-width: 640px) {
      .banner-container { aspect-ratio: 16 / 8; min-height: 80px; }
      .banner-container .banner-overlay { font-size: 0.7rem; padding: 0.3rem 0.8rem; }
    }

    /* ----- calendar nav (elegant pill) ----- */
    .calendar-nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: #f1f5f9;
      padding: 0.3rem 0.8rem 0.3rem 1.2rem;
      margin-bottom: 1.6rem;
      border: 1px solid #e9edf3;
    }
    .month-year { font-weight: 600; font-size: 1.1rem; color: #0b1a33; letter-spacing: -0.01em; }
    .nav-group { display: flex; gap: 0.3rem; }
    .nav-btn {
      background: white;
      border: 1px solid #e2e8f0;
      padding: 0.25rem 1.2rem;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.1s;
      color: #1e293b;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .nav-btn:hover { background: #e9edf3; border-color: #cbd5e1; }
    .today-btn { background: #1e3a6b; color: white; border: none; }
    .today-btn:hover { background: #0b1a33; }
    @media (max-width: 640px) {
      .calendar-nav { flex-direction: column; gap: 0.4rem; align-items: stretch; border-radius: 28px; padding: 0.8rem; }
      .nav-group { justify-content: center; }
    }

    /* ----- calendar grid (airy) ----- */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.3rem;
      margin-bottom: 1.8rem;
    }
    .weekday {
      text-align: center;
      font-weight: 600;
      font-size: 0.7rem;
      color: #64748b;
      padding: 0.25rem 0;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .cal-day {
      background: white;
      border-radius: 12px;
      padding: 0.4rem 0.1rem;
      text-align: center;
      border: 1px solid #eef2f6;
      cursor: default;
      transition: all 0.08s;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .cal-day.today {
      background: #fef9e3;
      border: 2px solid #f59e0b;
      box-shadow: 0 0 0 2px rgba(245,158,11,0.1);
    }
    .cal-day.has-holiday {
      background: #f0f7ff;
      border-bottom: 3px solid #2563eb;
    }
    .cal-day:not(.empty-day):hover {
      background: #f1f5f9;
      transform: scale(1.02);
      cursor: pointer;
      border-color: #cbd5e1;
    }
    .day-number { font-weight: 600; font-size: 1rem; color: #0b1a33; }
    .holiday-indicator {
      font-size: 0.45rem;
      background: #dbeafe;
      border-radius: 30px;
      padding: 0.05rem 0.5rem;
      margin-top: 0.15rem;
      color: #1e3a8a;
      font-weight: 600;
      white-space: nowrap;
      max-width: 92%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .empty-day { background: transparent; opacity: 0.2; pointer-events: none; border: 1px solid #f1f5f9; }

    /* ----- double panel (elegant cards) ----- */
    .double-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 1.8rem;
      margin: 1.8rem 0;
    }
    .panel {
      flex: 1 1 320px;
      background: #ffffff;
      border-radius: 4px;
      padding: 1.2rem 1.4rem 1.4rem;
      border: 1px solid #eef2f6;
      box-shadow: 0 4px 12px -6px rgba(0,0,0,0.02);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 0.5rem;
      margin-bottom: 0.9rem;
      flex-wrap: wrap;
      gap: 0.2rem;
    }
    .panel-header h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: #0b1a33;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .panel-header .selected-date {
      background: #f1f5f9;
      padding: 0.05rem 0.9rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 500;
      color: #1e293b;
    }
    .scroll-list {
      max-height: 440px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      padding-right: 0.1rem;
    }
    .scroll-list::-webkit-scrollbar { width: 4px; }
    .scroll-list::-webkit-scrollbar-thumb { background: #d1d9e6; border-radius: 20px; }

    .holiday-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 1rem;
      background: #f8fafc;
      border-radius: 60px;
      border: 1px solid #eef2f6;
      font-size: 0.85rem;
    }
    .holiday-name { font-weight: 500; display: flex; align-items: center; gap: 0.3rem; }
    .holiday-date { font-size: 0.65rem; background: white; padding: 0.05rem 0.8rem; border-radius: 30px; }
    .loader { text-align: center; padding: 1.5rem 0; color: #94a3b8; font-size: 0.85rem; }
    .no-data { text-align: center; padding: 1.2rem 0; color: #94a3b8; font-size: 0.85rem; }

    /* history cards with images */
    .history-card {
      background: #faf9f7;
      border-radius: 14px;
      padding: 0.6rem 0.9rem;
      border-left: 4px solid #d4a373;
      font-size: 0.8rem;
      line-height: 1.4;
      display: flex;
      gap: 0.8rem;
      align-items: flex-start;
      transition: background 0.1s;
    }
    .history-card:hover { background: #f1f4f8; }
    .history-card .history-content { flex: 1; min-width: 0; }
    .history-card .history-thumb {
      flex-shrink: 0;
      width: 64px;
      height: 64px;
      border-radius: 10px;
      object-fit: cover;
      background: #eef2f6;
      border: 1px solid #e2e8f0;
    }
    .history-card .history-thumb.loading {
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.3; }
    }
    .history-year { font-weight: 700; color: #b45309; font-size: 0.75rem; }
    .history-text { color: #1e293b; margin: 0.2rem 0; }
    .history-link { font-size: 0.65rem; color: #2563eb; text-decoration: none; font-weight: 500; }
    .history-link:hover { text-decoration: underline; }

    /* ----- AI panel (soft glow) ----- */
    .ai-panel {
      margin-top: 1.8rem;
      background: #f1f5f9;
      border-radius: 4px;
      padding: 1.4rem 2rem;
      border: 1px solid #e2e8f0;
      box-shadow: inset 0 1px 4px rgba(255,255,255,0.8);
    }
    .ai-panel-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: #0b1a33;
      margin-bottom: 0.6rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    #meaningfulText {
      font-size: 0.95rem;
      line-height: 1.7;
      color: #1e293b;
      max-height: 400px;
      overflow-y: auto;
      padding-right: 0.3rem;
    }
    #meaningfulText .headline { font-size: 1.1rem; font-weight: 700; color: #0f172a; margin-bottom: 0.2rem; }
    #meaningfulText .story-text { margin: 0.5rem 0; }

    /* ----- footer with resume link ----- */
    .footer {
      text-align: center;
      font-size: 0.75rem;
      color: #94a3b8;
      border-top: 1px solid #eef2f6;
      padding-top: 1.2rem;
      margin-top: 1.8rem;
      display: flex;
      justify-content: center;
      gap: 1.8rem;
      flex-wrap: wrap;
    }
    .footer a {
      color: #1e3a6b;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s;
    }
    .footer a:hover { color: #0b1a33; text-decoration: underline; }

    @media (max-width: 640px) {
      .cal-day { min-height: 52px; padding: 0.2rem 0.1rem; }
      .day-number { font-size: 0.85rem; }
      .ai-panel { padding: 1rem; }
      .panel { padding: 0.8rem; }
      .history-card { flex-direction: column; align-items: flex-start; }
      .history-card .history-thumb { width: 100%; height: 120px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- HERO -->
  <header class="hero">
    <h1>📜 On This Day <span>History & AI</span></h1>
    <div class="hero-badge" id="liveDateBadge">📅 Loading ...</div>
  </header>

  <!-- ROTATING BANNER (above calendar nav) -->
  <div class="banner-container" id="bannerContainer">
    <img id="bannerImg" class="active" src="https://picsum.photos/seed/calendar1/1200/400" alt="Historical calendar view">
    <div class="banner-overlay" id="bannerCaption">✨ Today in history — a visual journey</div>
  </div>

  <!-- CALENDAR NAV -->
  <nav class="calendar-nav">
    <div class="month-year" id="monthYearDisplay">Month Year</div>
    <div class="nav-group">
      <button class="nav-btn" id="prevMonthBtn">◀ Prev</button>
      <button class="nav-btn today-btn" id="goTodayBtn">Today</button>
      <button class="nav-btn" id="nextMonthBtn">Next ▶</button>
    </div>
  </nav>

  <!-- CALENDAR GRID -->
  <div class="calendar-grid" id="calendarGrid"></div>

  <!-- DOUBLE PANEL -->
  <div class="double-panel">
    <section class="panel">
      <div class="panel-header">
        <h3>🗓️ World Holidays</h3>
        <span class="selected-date" id="selectedDateHolidayLabel">—</span>
      </div>
      <div id="holidayContainer" class="scroll-list">
        <div class="loader">📖 Loading holidays...</div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h3>📜 On This Day</h3>
        <span class="selected-date" id="historyDateLabel">—</span>
      </div>
      <div id="historyContainer" class="scroll-list">
        <div class="loader">📖 Select a date</div>
      </div>
    </section>
  </div>

  <!-- AI STORY PANEL -->
  <section class="ai-panel">
    <div class="ai-panel-title">✨ AI Story of the Day</div>
    <div id="meaningfulText"><span class="loader">🧠 Generating AI insights...</span></div>
  </section>

  <!-- FOOTER with Resume link -->
  <footer class="footer">
    <span><a href="https://calendarlyai.netlify.app/document.pdf" target="_blank">Ankit Arora</a></span>
  </footer>
</div>

<script>
  (async function() {
    // ----- helpers -----
    function formatYMD(date) {
      let y = date.getFullYear();
      let m = String(date.getMonth() + 1).padStart(2, '0');
      let d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    function parseDate(ymd) {
      const [y, m, d] = ymd.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function formatDateNice(date) {
      return date.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }

    // ----- state -----
    let holidaysByDate = new Map();
    let selectedDate = new Date();
    let currentDisplayMonth = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), 1);

    const grid = document.getElementById('calendarGrid');
    const monthDisplay = document.getElementById('monthYearDisplay');
    const holidayContainer = document.getElementById('holidayContainer');
    const historyContainer = document.getElementById('historyContainer');
    const selectedHolidayLabel = document.getElementById('selectedDateHolidayLabel');
    const historyLabel = document.getElementById('historyDateLabel');
    const liveBadge = document.getElementById('liveDateBadge');
    const meaningfulDiv = document.getElementById('meaningfulText');

    // ----- Infinite Random Rotating Banner -----
function initRandomBanner() {
  const bannerContainer = document.getElementById('bannerContainer');
  const bannerImg = document.getElementById('bannerImg');
  const bannerCaption = document.getElementById('bannerCaption');
  
  const captions = [
    '📅 A glimpse into history',
    '🌍 World events through time',
    '🏛️ Monuments & memories',
    '✨ Moments that shaped the world',
    '📜 Stories of the past',
    '🎨 Art & history intertwine',
    '🏺 Ancient civilizations',
    '⚔️ Battles that changed history',
    '🌅 Dawn of new eras',
    '📚 Knowledge through ages',
    '🎭 Cultural milestones',
    '🚀 Human achievements',
    '🌟 Legendary figures',
    '🏰 Medieval times',
    '🎪 Renaissance wonders',
    '⚡ Revolutionary moments',
    '🌊 Voyages of discovery',
    '🔭 Scientific breakthroughs',
    '🎵 Musical revolutions',
    '📖 Literary masterpieces'
  ];
  
  // Generate a random image URL
  function getRandomImage() {
    const randomSeed = Math.random().toString(36).substring(2, 10);
    const randomId = Math.floor(Math.random() * 10000);
    const width = 1200;
    const height = 400;
    return `https://picsum.photos/seed/${randomSeed}${randomId}/${width}/${height}`;
  }
  
  // Get a random caption
  function getRandomCaption() {
    return captions[Math.floor(Math.random() * captions.length)];
  }
  
  // Update banner with random image
  function updateBanner() {
    const newSrc = getRandomImage();
    const newCaption = getRandomCaption();
    
    // Fade out
    bannerImg.classList.remove('active');
    
    setTimeout(() => {
      bannerImg.src = newSrc;
      bannerImg.alt = newCaption;
      bannerCaption.textContent = newCaption;
      // Fade in
      bannerImg.classList.add('active');
    }, 150);
  }
  
  // Set initial random image
  bannerImg.src = getRandomImage();
  bannerImg.alt = getRandomCaption();
  bannerCaption.textContent = getRandomCaption();
  bannerImg.classList.add('active');
  
  // Rotate every 5 seconds (infinite)
  setInterval(updateBanner, 5000);
}

// Call this when the page loads
document.addEventListener('DOMContentLoaded', initRandomBanner);

    // ----- fetch holidays -----
    async function fetchHolidayData() {
      try {
        const resp = await fetch('https://api-bmtdaily.koyeb.app/holidays');
        if (!resp.ok) throw new Error('API error');
        return await resp.json();
      } catch (e) {
        console.error('Holiday fetch error:', e);
        return null;
      }
    }

    function processHolidays(data) {
      if (!data || !data.user) return;
      const user = data.user;
      const holidays = user.holidays || [];
      const upcoming = user.upcoming_holidays || [];
      const all = [...holidays, ...upcoming];
      const unique = [];
      const seen = new Set();
      for (const h of all) {
        const key = h.name + '|' + h.date;
        if (!seen.has(key)) { seen.add(key); unique.push(h); }
      }
      const map = new Map();
      for (const h of unique) {
        const d = h.date;
        if (!map.has(d)) map.set(d, []);
        map.get(d).push(h);
      }
      holidaysByDate = map;
    }

    // ----- render calendar -----
    function renderCalendar() {
      const year = currentDisplayMonth.getFullYear();
      const month = currentDisplayMonth.getMonth();
      const firstDay = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      let startOffset = (firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1);

      const weekdays = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];
      let html = weekdays.map(d => `<div class="weekday">${d}</div>`).join('');
      const todayYMD = formatYMD(new Date());

      for (let i = 0; i < startOffset; i++) {
        html += `<div class="cal-day empty-day"></div>`;
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const cellDate = new Date(year, month, d);
        const ymd = formatYMD(cellDate);
        const isToday = (ymd === todayYMD);
        const hasHoliday = holidaysByDate.has(ymd) && holidaysByDate.get(ymd).length > 0;
        const holidayNames = hasHoliday ? holidaysByDate.get(ymd).map(h => h.name).slice(0, 2) : [];

        let cls = 'cal-day';
        if (isToday) cls += ' today';
        if (hasHoliday) cls += ' has-holiday';

        let indicator = '';
        if (hasHoliday) {
          const label = holidayNames.join(' · ');
          indicator = `<div class="holiday-indicator">${label.length > 18 ? label.slice(0, 16)+'…' : label}</div>`;
        }

        html += `<div class="${cls}" data-date="${ymd}">
          <div class="day-number">${d}</div>
          ${indicator}
        </div>`;
      }

      grid.innerHTML = html;

      const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      monthDisplay.textContent = `${monthNames[month]} ${year}`;

      const todayStr = formatYMD(new Date());
      const count = holidaysByDate.get(todayStr)?.length || 0;
      liveBadge.textContent = `📅 ${formatDateNice(new Date())} · ${count} holiday${count!==1?'s':''}`;

      document.querySelectorAll('.cal-day[data-date]').forEach(el => {
        el.addEventListener('click', function() {
          const ymd = this.dataset.date;
          const dateObj = parseDate(ymd);
          selectedDate = dateObj;
          updatePanels(dateObj);
          generateAIStory(dateObj);
        });
      });
    }

    // ----- update panels -----
    async function updatePanels(dateObj) {
      const ymd = formatYMD(dateObj);
      const formatted = formatDateNice(dateObj);

      selectedHolidayLabel.textContent = formatted;
      const holidays = holidaysByDate.get(ymd) || [];
      if (holidays.length === 0) {
        holidayContainer.innerHTML = `<div class="no-data">✨ No holidays on ${formatted}</div>`;
      } else {
        let html = '';
        for (const h of holidays) {
          const type = h.type || 'public';
          const emoji = type.includes('public') ? '🏛️' : '🎉';
          html += `<div class="holiday-item">
            <span class="holiday-name">${emoji} ${h.name}</span>
            <span class="holiday-date">${h.formatted_date || h.date}</span>
          </div>`;
        }
        holidayContainer.innerHTML = html;
      }

      historyLabel.textContent = formatted;
      historyContainer.innerHTML = `<div class="loader">📖 Loading on this day for ${formatted}...</div>`;
      await fetchAndRenderOnThisDay(dateObj);
    }

    // ----- get Wikipedia thumbnail via page ID -----
    async function getPageImage(pageId) {
      if (!pageId) return null;
      try {
        const url = `https://en.wikipedia.org/w/api.php?action=query&prop=pageimages&pithumbsize=120&pageids=${pageId}&format=json&origin=*`;
        const resp = await fetch(url);
        if (!resp.ok) return null;
        const data = await resp.json();
        const pages = data.query?.pages || {};
        const page = pages[pageId];
        if (page && page.thumbnail && page.thumbnail.source) {
          return page.thumbnail.source;
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    // ----- on this day (Wikimedia) with images -----
    const cache = new Map();

    async function fetchAndRenderOnThisDay(dateObj) {
      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      const key = `${month}-${day}`;

      let data;
      if (cache.has(key)) {
        data = cache.get(key);
      } else {
        try {
          const url = `https://api.wikimedia.org/feed/v1/wikipedia/en/onthisday/all/${month}/${day}`;
          const resp = await fetch(url, { headers: { 'Api-User-Agent': 'OnThisDayApp/1.0' } });
          if (resp.ok) {
            data = await resp.json();
            cache.set(key, data);
          } else {
            data = { selected: [], events: [], births: [], deaths: [], holidays: [] };
          }
        } catch (e) {
          data = { selected: [], events: [], births: [], deaths: [], holidays: [] };
        }
      }

      // Collect all page IDs for image fetching
      const allItems = [
        ...(data.selected || []),
        ...(data.events || []),
        ...(data.births || []),
        ...(data.deaths || []),
        ...(data.holidays || [])
      ];
      
      // Fetch images in parallel with rate limiting
      const imageCache = new Map();
      for (const item of allItems) {
        const page = item.pages?.[0];
        if (page && page.pageid) {
          const pageId = page.pageid;
          if (!imageCache.has(pageId)) {
            const img = await getPageImage(pageId);
            imageCache.set(pageId, img);
            await new Promise(r => setTimeout(r, 50));
          }
        }
      }

      let html = '';
      const sections = [
        { label: '⭐ Featured', items: data.selected || [] },
        { label: '📆 Events', items: data.events || [] },
        { label: '🎂 Births', items: data.births || [] },
        { label: '🕯️ Deaths', items: data.deaths || [] },
        { label: '🌍 Holidays', items: data.holidays || [] }
      ];

      for (const section of sections) {
        if (section.items.length === 0) continue;
        html += `<div style="font-weight:600;font-size:0.7rem;color:#475569;margin:0.4rem 0 0.15rem;">${section.label}</div>`;
        for (const item of section.items) {
          const pages = item.pages || [];
          const page = pages[0] || {};
          const pageId = page.pageid;
          const title = page.normalizedtitle || page.title || '';
          const extract = page.extract || item.text || '';
          const link = page.content_urls?.desktop?.page || '#';
          const year = item.year ? ` (${item.year})` : '';
          const displayText = extract.length > 140 ? extract.slice(0, 140) + '…' : extract;
          
          const imgUrl = pageId ? imageCache.get(pageId) : null;
          const imgHtml = imgUrl 
            ? `<img src="${imgUrl}" class="history-thumb" alt="${title}" loading="lazy" onerror="this.style.display='none'">`
            : `<div class="history-thumb" style="background:#eef2f6;display:flex;align-items:center;justify-content:center;font-size:1.5rem;">📄</div>`;

          html += `<div class="history-card">
            ${imgHtml}
            <div class="history-content">
              <div class="history-year">${title}${year}</div>
              <div class="history-text">${displayText}</div>
              <a href="${link}" target="_blank" rel="noopener" class="history-link">Read more →</a>
            </div>
          </div>`;
        }
      }

      if (!html) {
        html = `<div class="no-data">No records found for this date.</div>`;
      }
      historyContainer.innerHTML = html;
    }

    // ----- AI story generation -----
    async function generateAIStory(dateObj) {
      const formatted = formatDateNice(dateObj);
      meaningfulDiv.innerHTML = `<span class="loader">🧠 Crafting AI story for ${formatted}...</span>`;

      const month = String(dateObj.getMonth() + 1).padStart(2, '0');
      const day = String(dateObj.getDate()).padStart(2, '0');
      let contextText = '';
      try {
        const resp = await fetch(`https://api.wikimedia.org/feed/v1/wikipedia/en/onthisday/all/${month}/${day}`);
        if (resp.ok) {
          const data = await resp.json();
          const allEvents = [...(data.selected || []), ...(data.events || []), ...(data.births || []), ...(data.deaths || [])];
          contextText = allEvents.slice(0, 8).map(e => e.text || '').join(' · ');
        }
      } catch (e) {}

      const prompt = `You are a brilliant historian and storyteller. What is special about ${formatted}? Based on these events: ${contextText || 'historical events'}. Write a short, engaging, story-driven summary (3-4 paragraphs).`;

      try {
        const response = await fetch('https://api-bmtdaily.koyeb.app/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt: { query: prompt, stream: false, isSearch: true, timeout: 15000, model: 'openai/gpt-oss-120b' }
          })
        });
        if (response.ok) {
          const result = await response.json();
          const text = result?.completion || '';
          if (text) {
            meaningfulDiv.innerHTML = `<div class="story-text">${text.replace(/\n/g, '<br>')}</div>`;
            return;
          }
        }
      } catch (e) {}

      // fallback
      meaningfulDiv.innerHTML = `<div class="story-text">
        <div class="headline">📜 Reflections on ${formatted}</div>
        <p>On this day, history weaves together moments of triumph, discovery, and remembrance. From groundbreaking inventions to the birth of visionaries, each date holds a unique echo in the human story.</p>
        <p>Explore the events above to uncover the rich tapestry of this day — and let the past inspire your present.</p>
      </div>`;
    }

    // ----- navigation -----
    function goPrevMonth() {
      currentDisplayMonth.setMonth(currentDisplayMonth.getMonth() - 1);
      renderCalendar();
      updatePanels(selectedDate);
      generateAIStory(selectedDate);
    }
    function goNextMonth() {
      currentDisplayMonth.setMonth(currentDisplayMonth.getMonth() + 1);
      renderCalendar();
      updatePanels(selectedDate);
      generateAIStory(selectedDate);
    }
    function goToday() {
      const today = new Date();
      currentDisplayMonth = new Date(today.getFullYear(), today.getMonth(), 1);
      selectedDate = new Date(today);
      renderCalendar();
      updatePanels(selectedDate);
      generateAIStory(selectedDate);
    }

    document.getElementById('prevMonthBtn').addEventListener('click', goPrevMonth);
    document.getElementById('nextMonthBtn').addEventListener('click', goNextMonth);
    document.getElementById('goTodayBtn').addEventListener('click', goToday);

    // ----- init -----
    const rawData = await fetchHolidayData();
    if (rawData) processHolidays(rawData);
    else holidaysByDate = new Map();

    const today = new Date();
    selectedDate = new Date(today);
    currentDisplayMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    renderCalendar();
    await updatePanels(selectedDate);
    await generateAIStory(selectedDate);
  })();
</script>
</body>
</html>
